  - name: eyebrow_color
    label: Small heading color
    type: select
    options:
      values:
      - orange
      - pink
      - purple
      - cyan
      - yellow
      - white
  - name: eyebrow_font
    label: Small heading font
    type: select
    options:
      values:
      - Barlow Condensed
      - Barlow Condensed Italic
      - Anton
      - Oswald
      - Oswald Italic
      - Bebas Neue
      - Roboto Condensed
      - Roboto Condensed Italic
      - Archivo Black
  - name: eyebrow_size
    label: Small heading size (px)
    type: number
  - name: title_color
    label: Main title color
    type: select
    options:
      values:
      - orange
      - pink
      - purple
      - cyan
      - yellow
      - white
  - name: shadow_color
    label: Offset layer color
    type: select
    options:
      values:
      - cyan
      - pink
      - purple
      - orange
      - yellow
      - white
  - name: title_font
    label: Main title font
    type: select
    options:
      values:
      - Barlow Condensed
      - Barlow Condensed Italic
      - Anton
      - Oswald
      - Oswald Italic
      - Bebas Neue
      - Roboto Condensed
      - Roboto Condensed Italic
      - Archivo Black
  - name: title_size
    label: Main title size in pixels (48-180)
    type: number
