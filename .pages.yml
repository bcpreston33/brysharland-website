media:
  input: assets/uploads
  output: /assets/uploads
content:
- name: artwork
  label: Artwork
  type: collection
  path: content/artwork
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    - year
    - featured
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 01 · ARTWORK DETAILS  /  Artwork title
    type: string
    required: true
    description: 'Section 1: Artwork details.'
  - name: image
    label: Artwork image
    type: image
    required: true
    description: Artwork image displayed in the gallery.
  - name: category
    label: Category
    type: select
    required: true
    options:
      values:
      - Queer
      - Portraits
      - Star Wars
      - Various
  - name: year
    label: Year
    type: string
  - name: medium
    label: Medium
    type: string
  - name: dimensions
    label: Dimensions
    type: string
  - name: description
    label: Description
    type: text
  - name: featured
    label: 02 · HOMEPAGE & ORDERING  /  Feature on homepage
    type: boolean
    default: false
    description: 'Section 2: Homepage & ordering. Controls whether this artwork is eligible for the homepage featured
      area.'
  - name: published_on
    label: Date added to website (YYYY-MM-DD)
    type: date
    description: Required for automatic homepage display. Enter the date this artwork was added to the website.
  - name: feature_days
    label: Featured days override (0 uses default)
    type: number
    default: 0
    description: Optional. Leave at 0 for the default duration (30 days).
  - name: feature_override
    label: Homepage feature behavior
    type: select
    default: automatic
    options:
      values:
      - automatic
      - pin
      - hide
    description: Automatic = show while recent; Pin = keep featured; Hide = never show.
  - name: feature_until
    label: Feature end date override (YYYY-MM-DD)
    type: date
    description: Optional expiration date for a pinned or automatically featured artwork.
  - name: order
    label: Display order
    type: number
    description: Lower numbers appear first where ordering is supported.
- name: news
  label: News & Events
  type: collection
  path: content/news
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - published_on
    - feature_override
    primary: title
  fields:
  - name: title
    label: Headline
    type: string
    required: true
    description: Create a new entry here to trigger the News & Events homepage card.
  - name: description
    label: Short description
    type: text
  - name: image
    label: Card image
    type: image
    required: true
  - name: link
    label: Article or event URL
    type: string
    required: true
  - name: published_on
    label: Publication date
    type: date
    required: true
    description: Use YYYY-MM-DD; future-dated entries do not appear yet.
  - name: feature_days
    label: Featured days override (0 uses default)
    type: number
    default: 0
  - name: feature_override
    label: Feature behavior
    type: select
    default: automatic
    options:
      values:
      - automatic
      - pin
      - hide
    description: Automatic = show while recent; Pin = keep featured; Hide = never show.
  - name: feature_until
    label: Feature end date override
    type: date
- name: featured-home
  label: Homepage Featured Cards
  type: file
  path: content/pages/featured-home.md
  format: yaml-frontmatter
  fields:
  - name: default_days
    label: Default feature duration (days)
    type: number
    default: 30
    description: Number of days a new artwork or news item appears automatically (default 30).
  - name: art_mode
    label: Artwork card mode
    type: select
    default: automatic
    options:
      values:
      - automatic
      - pin
      - hide
  - name: art_pin_title
    label: Artwork title to pin (exact match)
    type: string
    description: Used only when the corresponding card mode is Pin. Enter the exact title of an eligible item.
  - name: news_mode
    label: News card mode
    type: select
    default: automatic
    options:
      values:
      - automatic
      - pin
      - hide
  - name: news_pin_title
    label: News title to pin (exact match)
    type: string
    description: Used only when the corresponding card mode is Pin. Enter the exact title of an eligible item.
- name: gallery-pages
  label: Gallery Page Settings
  type: collection
  path: content/gallery-pages
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - slug
    - title
    - title_color
