      - { name: title_color, label: Page title front color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: shadow_color, label: Page title offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: title_font, label: Page title font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: title_size, label: Page title size (px), type: number }
      - { name: section_color, label: Section heading front color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: section_shadow_color, label: Section heading offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: section_font, label: Section heading font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: section_size, label: Section heading size (px), type: number }
      - { name: section_title, label: Content heading, type: string }
      - { name: body, label: Store description, type: rich-text }
      - { name: button_text, label: Store button label, type: string }
      - { name: store_url, label: External store URL, type: string }


  - name: global-appearance
    label: Global Appearance
    type: file
    path: content/pages/global-appearance.md
    format: yaml-frontmatter
    fields:
      - { name: site_name, label: Browser tab site name, type: string }
      - { name: background_color, label: Main background hex, type: string }
      - { name: text_color, label: Main text hex, type: string }
      - { name: pink, label: Neon pink hex, type: string }
      - { name: cyan, label: Neon cyan hex, type: string }
      - { name: orange, label: Neon orange hex, type: string }
      - { name: yellow, label: Neon yellow hex, type: string }
      - { name: purple, label: Neon purple hex, type: string }
      - name: body_font
        label: General body font
        type: select
        options:
          values: [DM Sans, Barlow Condensed, Oswald, Roboto Condensed]
      - name: heading_font
        label: General heading font
        type: select
        options:
          values: [Barlow Condensed, Anton, Oswald, Bebas Neue, Roboto Condensed, Archivo Black]
  - name: homepage-appearance
    label: Homepage Appearance
    type: file
    path: content/pages/home-appearance.md
    format: yaml-frontmatter
    fields:
      - { name: hero_min_height, label: Hero minimum height desktop (px), type: number }
      - { name: hero_min_height_mobile, label: Hero minimum height mobile (px), type: number }
      - { name: hero_image_width, label: Hero background image width percent desktop, type: number }
      - { name: hero_image_position, label: Hero background image horizontal position percent, type: number }
      - { name: section_spacing, label: Homepage section vertical padding (px), type: number }
      - { name: slogan_font_size, label: Slogan font size desktop (px), type: number }
      - { name: slogan_font_size_mobile, label: Slogan font size mobile (px), type: number }
  - name: gallery-appearance
    label: Gallery Appearance
    type: file
