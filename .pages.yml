    - order
    - visible
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 01 · STORE CARD CONTENT  /  Store name
    type: string
    required: true
    description: 'Section 1: Store card content.'
