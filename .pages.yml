      - { name: section_size, label: Section heading size (px), type: number }
      - { name: form_heading, label: Contact form heading, type: string }
      - { name: form_intro, label: Contact page introduction, type: text }
      - { name: social_heading, label: Social links heading, type: string }
      - { name: deviantart, label: DeviantArt URL, type: string }
      - { name: instagram, label: Instagram URL, type: string }
      - { name: bluesky, label: Bluesky URL, type: string }
