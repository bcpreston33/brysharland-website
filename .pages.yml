    label: Short description
    type: text
  - name: url
    label: Square storefront URL
    type: string
  - name: button_text
    label: Button text
    type: string
    description: Text of the homepage Explore the Work button.
  - name: visible
    label: 02 · VISIBILITY & ORDERING  /  Show this storefront
    type: boolean
    default: true
    description: 'Section 2: Visibility & ordering. Turn off to hide this storefront without deleting it.'
  - name: order
    label: Display order (lower first)
    type: number
    description: Lower numbers appear first where ordering is supported.
