- name: website-images
  label: Website Images (reference library)
  type: collection
  path: content/website-images
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - placement
    primary: title
  fields:
  - name: title
    label: Image name
    type: string
    required: true
  - name: image
    label: Website image
    type: image
    required: true
  - name: placement
    label: Intended use / page
    type: string
    description: Reference label only. Images are placed using the relevant page controls (Home, About, Navigation &
      Footer, etc.).
  - name: notes
    label: Notes
    type: text
- name: news
  label: News & Updates
  type: collection
  path: content/news
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - category
    primary: title
  fields:
  - name: title
    label: Headline
    type: string
    required: true
    description: Save a new entry to automatically feature it for 30 days. The newest update replaces the previous card.
      All updates remain listed on the About page.
  - name: category
    label: Type of update
    type: select
    default: Personal Update
    options:
      values:
      - Exhibition / Show
      - Press / Media
      - Event / Appearance
      - Personal Update
      - General Announcement
    description: Optional category shown on the homepage and in the About page archive.
  - name: description
    label: Short description
    type: text
  - name: full_text
    label: Full announcement (optional)
    type: text
    description: Longer text shown in the announcement popup. Leave blank to use the short description.
  - name: click_behavior
    label: What happens when clicked
    type: select
    default: popup
    options:
      values:
      - value: popup
        label: Open announcement popup
      - value: external
        label: Go directly to external link
    description: Direct links require an external URL. Without one, the announcement opens in a popup.
  - name: icon
    label: Optional icon
    type: select
    options:
      values:
      - None
      - Star
      - Calendar
      - Newspaper
      - Heart
      - Sparkles
    default: None
    description: Used when no image is supplied.
  - name: image
    label: Optional image
    type: image
    description: Optional. Without an image, the featured card displays a text-only layout.
  - name: link
    label: Optional external link
    type: string
    description: Leave blank for personal updates without an external page.
- name: featured-home
  label: Homepage Featured Cards (Advanced)
  type: file
  path: content/pages/featured-home.md
  format: yaml-frontmatter
  fields:
  - name: default_days
    label: Default feature duration (days)
    type: number
    default: 30
    description: 30 days by default. New artwork and news automatically replace older entries; no dates to enter.
  - name: art_mode
    label: Artwork card mode
    type: select
    default: automatic
    options:
      values:
      - automatic
      - hide
    description: Leave on automatic for normal behavior; Hide temporarily disables this homepage card.
  - name: news_mode
    label: News card mode
    type: select
    default: automatic
    options:
      values:
      - automatic
      - hide
    description: Leave on automatic for normal behavior; Hide temporarily disables this homepage card.
- name: gallery-pages
  label: Gallery Page Settings
  type: collection
  path: content/gallery-pages
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - slug
    - title
    - title_color
    primary: slug
  fields:
  - name: slug
    label: 01 · PAGE INTRODUCTION  /  Page ID
    type: select
    required: true
    options:
      values:
      - queer
      - portraits
      - star-wars
      - various
    description: 'Section 1: Page introduction.'
  - name: eyebrow
    label: Small heading
    type: string
    description: Optional small heading above the main page title.
  - name: title
    label: Main title
    type: string
    required: true
  - name: description
    label: Description
    type: text
  - name: artwork_sequence
    label: 03 · GALLERY ORDER / Artwork sequence
    type: text
    description: One artwork title per line, from first to last. Move lines up or down to reorder the gallery. New artwork not listed here appears at the end automatically. Keep duplicate-title entries with their filename suffix.
  - name: intro_brush
    label: Intro phrase (brush font; leave blank to hide)
    type: string
    description: Optional decorative introduction phrase; leave empty to hide.
  - name: intro_brush_color
    label: 02 · HEADING APPEARANCE  /  Intro phrase color
    type: select
    options:
      values:
      - pink
      - orange
      - purple
      - cyan
      - yellow
      - white
    description: 'Section 2: Heading appearance.'
  - name: eyebrow_color
    label: Small heading color
    type: select
    options:
      values:
      - orange
      - pink
      - purple
      - cyan
      - yellow
      - white
  - name: eyebrow_font
    label: Small heading font
    type: select
    options:
      values:
      - Barlow Condensed
      - Barlow Condensed Italic
      - Anton
      - Oswald
      - Oswald Italic
      - Bebas Neue
      - Roboto Condensed
      - Roboto Condensed Italic
      - Archivo Black
  - name: eyebrow_size
    label: Small heading size (px)
    type: number
  - name: title_color
    label: Main title color
    type: select
    options:
      values:
      - orange
      - pink
      - purple
      - cyan
      - yellow
      - white
  - name: shadow_color
    label: Offset layer color
    type: select
    options:
      values:
      - cyan
      - pink
      - purple
      - orange
      - yellow
      - white
  - name: title_font
    label: Main title font
    type: select
    options:
      values:
      - Barlow Condensed
      - Barlow Condensed Italic
      - Anton
      - Oswald
      - Oswald Italic
      - Bebas Neue
      - Roboto Condensed
      - Roboto Condensed Italic
      - Archivo Black
  - name: title_size
    label: Main title size in pixels (48-180)
    type: number
