content:
- name: artwork-portraits
  label: Portraits
  type: collection
  path: content/artwork-portraits
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    fields:
    - title
    - year
    - order
    primary: title
    sort:
    - order
    - title
    default:
      sort: order
      order: asc
  fields:
  - name: title
    label: 01 · ARTWORK DETAILS  /  Artwork title
    type: string
    required: true
    description: Artwork for the Portraits gallery. Add a main image; extra images are optional.
  - name: image
    label: Artwork image
    type: image
    required: true
    description: Artwork image displayed in the gallery.
  - name: additional_images
    label: Additional artwork images (optional)
    type: list
    description: Add extra views or close-ups. The main image remains the gallery thumbnail and first enlarged image.
      Extra photos appear only in the enlarged viewer. Drag to reorder.
    field:
      name: image
      label: Additional image
      type: image
  - name: year
    label: Year (optional)
    type: string
  - name: medium
    label: Medium (optional)
    type: string
  - name: dimensions
    label: Dimensions (optional)
    type: string
  - name: description
    label: Description (optional)
    type: text
    description: "Optional artwork description. To add a clickable link, write [link text](https://example.com). Links open in a new tab."
  - name: print_url
    label: Print purchase link (optional)
    type: string
    description: Paste the direct store product URL when a print is available. Leave blank to hide the outlined Buy a
      Print button in the artwork viewer.
  - name: order
    label: 02 · GALLERY DISPLAY / Display order
    type: number
    description: Lower numbers appear first. Entries with the same number are sorted using the site’s secondary ordering.
