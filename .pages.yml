media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: artwork
    label: Artwork
    type: collection
    path: content/artwork
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [title, category, year, featured, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Artwork title
        type: string
        required: true
      - name: image
        label: Artwork image
        type: image
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Queer, Portraits, Star Wars, Nintendo, Miscellaneous]
      - name: year
        label: Year
        type: string
      - name: medium
        label: Medium
        type: string
      - name: dimensions
        label: Dimensions
        type: string
      - name: description
        label: Description
        type: text
      - name: featured
        label: Feature on homepage
        type: boolean
        default: false
      - name: order
        label: Display order
        type: number

  - name: gallery-pages
    label: Gallery Page Settings
    type: collection
    path: content/gallery-pages
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [slug, title, title_color]
      primary: slug
    fields:
      - name: slug
        label: Page ID
        type: select
        required: true
        options:
          values: [queer, portraits, star-wars, nintendo, miscellaneous]
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Main title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - { name: eyebrow_color, label: Small heading color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: eyebrow_font, label: Small heading font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: eyebrow_size, label: Small heading size (px), type: number }
      - name: title_color
        label: Main title color
        type: select
        options:
          values: [orange, pink, purple, cyan, yellow, white]
      - name: shadow_color
        label: Offset layer color
        type: select
        options:
          values: [cyan, pink, purple, orange, yellow, white]
      - name: title_font
        label: Main title font
        type: select
        options:
          values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black]
      - name: title_size
        label: Main title size in pixels (48-180)
        type: number

  - name: homepage
    label: Homepage
    type: file
    path: content/pages/home.md
    format: yaml-frontmatter
    fields:
      - { name: eyebrow_color, label: Hero small heading color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: eyebrow_size, label: Hero small heading size (px), type: number }
      - { name: work_heading_color, label: Artwork section heading color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: work_heading_shadow, label: Artwork section offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: work_heading_size, label: Artwork section heading size (px), type: number }
      - { name: feature_heading_color, label: Featured project heading color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: feature_heading_shadow, label: Featured project offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: feature_heading_size, label: Featured project heading size (px), type: number }
      - name: hero_image
        label: Hero image
        type: image
      - name: bry_heading_image
        label: BRY heading image (transparent PNG or WebP)
        type: image
      - name: sharland_heading_image
        label: SHARLAND heading image (transparent PNG or WebP)
        type: image
      - name: bry_width_desktop
        label: BRY width desktop (percent, 10-100)
        type: number
      - name: sharland_width_desktop
        label: SHARLAND width desktop (percent, 10-100)
        type: number
      - name: bry_width_mobile
        label: BRY width mobile (percent, 10-100)
        type: number
      - name: sharland_width_mobile
        label: SHARLAND width mobile (percent, 10-100)
        type: number
      - name: heading_gap_desktop
        label: Space between images desktop (pixels)
        type: number
      - name: heading_gap_mobile
        label: Space between images mobile (pixels)
        type: number
      - name: heading_alignment
        label: Heading alignment
        type: select
        options:
          values: [left, center, right]
      - name: hero_alt
        label: Hero image description
        type: string
      - name: eyebrow
        label: Small intro heading
        type: string
      - name: hero_title
        label: Large hero title
        type: string
      - name: hero_subtitle
        label: Second title line
        type: string
      - name: slogan_one
        label: Slogan line 1
        type: string
      - name: slogan_two
        label: Slogan line 2
        type: string
      - name: slogan_three
        label: Slogan line 3
        type: string
      - name: button_text
        label: Explore button text
        type: string
      - name: work_heading
        label: Artwork section heading
        type: string
      - name: work_heading_accent
        label: Artwork section accent text
        type: string
      - name: category_note
        label: Text below artwork categories (leave blank to hide)
        type: text
      - name: queer_image
        label: Queer category image
        type: image
      - name: portraits_image
        label: Portraits category image
        type: image
      - name: star_wars_image
        label: Star Wars category image
        type: image
      - name: nintendo_image
        label: Nintendo category image
        type: image
      - name: miscellaneous_image
        label: Miscellaneous category image
        type: image
      - name: feature_eyebrow
        label: Featured project small heading
        type: string
      - name: feature_title
        label: Featured project title
        type: string
      - name: feature_description
        label: Featured project description
        type: text
      - name: feature_button_text
        label: Featured project button
        type: string
      - name: feature_url
        label: Featured project URL
        type: string
      - name: feature_image
        label: Featured project image (optional)
        type: image

  - name: about-page
    label: About Page
    type: file
    path: content/pages/about.md
    format: yaml-frontmatter
    fields:
      - { name: eyebrow, label: Small heading, type: string }
      - { name: title, label: Page title, type: string }
      - { name: eyebrow_color, label: Small heading color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: eyebrow_font, label: Small heading font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: eyebrow_size, label: Small heading size (px), type: number }
      - { name: title_color, label: Page title front color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: shadow_color, label: Page title offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: title_font, label: Page title font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: title_size, label: Page title size (px), type: number }
      - { name: section_color, label: Section heading front color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: section_shadow_color, label: Section heading offset color, type: select, options: { values: [orange, pink, purple, cyan, yellow, white] } }
      - { name: section_font, label: Section heading font, type: select, options: { values: [Barlow Condensed, Barlow Condensed Italic, Anton, Oswald, Oswald Italic, Bebas Neue, Roboto Condensed, Roboto Condensed Italic, Archivo Black] } }
      - { name: section_size, label: Section heading size (px), type: number }
      - { name: section_title, label: Content heading, type: string }
      - { name: body, label: Artist biography, type: rich-text }
      - { name: collage_desktop, label: Desktop and tablet collage, type: image }
      - { name: collage_mobile, label: Mobile collage (700px and below), type: image }
      - { name: image, label: Artist photograph (legacy field), type: image }

