media:
  input: assets/uploads
  output: /assets/uploads

content:
  - name: artwork
    label: Artwork
    type: collection
    path: content/artwork
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [title, category, year, featured, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Artwork title
        type: string
        required: true
      - name: image
        label: Artwork image
        type: image
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Queer, Portraits, Star Wars, Nintendo, Miscellaneous]
      - name: year
        label: Year
        type: string
      - name: medium
        label: Medium
        type: string
      - name: dimensions
        label: Dimensions
        type: string
      - name: description
        label: Description
        type: text
      - name: featured
        label: Feature on homepage
        type: boolean
        default: false
      - name: order
        label: Display order
        type: number

  - name: gallery-pages
    label: Gallery Page Settings
    type: collection
    path: content/gallery-pages
    format: yaml-frontmatter
    filename: '{primary}.md'
    view:
      fields: [slug, title, title_color]
      primary: slug
    fields:
      - name: slug
        label: Page ID
        type: select
        required: true
        options:
          values: [queer, portraits, star-wars, nintendo, miscellaneous]
      - name: eyebrow
        label: Small heading
        type: string
      - name: title
        label: Main title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: title_color
        label: Main title color
        type: select
        options:
          values: [orange, pink, purple, cyan, yellow, white]
      - name: shadow_color
        label: Offset layer color
        type: select
        options:
          values: [cyan, pink, purple, orange, yellow, white]
      - name: title_font
        label: Main title font
        type: select
        options:
          values: [Barlow Condensed, Anton, Oswald]
      - name: title_size
        label: Main title size in pixels (48-180)
        type: number
