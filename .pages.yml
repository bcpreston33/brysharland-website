      - { name: gallery_row_gap, label: Artwork vertical gap (px), type: number }
      - { name: caption_font_size, label: Caption text size (px), type: number }
      - { name: caption_background, label: Caption background hex, type: string }
      - { name: gallery_border_width, label: Neon separator thickness (px), type: number }
  - name: navigation-footer
    label: Navigation & Footer
    type: file
    path: content/pages/navigation-footer.md
    format: yaml-frontmatter
    fields:
      - { name: logo_image, label: Header logo image, type: image }
      - { name: logo_width, label: Header logo width (px), type: number }
      - name: navigation_font
        label: Navigation font
        type: select
        options:
          values: [DM Sans, Barlow Condensed, Oswald, Roboto Condensed]
      - { name: nav_home, label: Home menu label, type: string }
      - { name: nav_artwork, label: Artwork menu label, type: string }
      - { name: nav_about, label: About menu label, type: string }
      - { name: nav_contact, label: Contact menu label, type: string }
      - { name: nav_store, label: Store menu label, type: string }
      - { name: footer_text, label: Footer copyright text, type: string }
